<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Us | Transit News</title>
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/style.css">
        <script type="module" src="js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <nav class="navbar md:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Transit News</a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNavMenu" aria-controls="navbarNavMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavMenu" aria-labelledby="navbarNavMenuLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarNavMenuLabel">Menu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body">
                        <ul class="navbar-nav me-auto mb-2">
                            <li class="nav-item">
                                <a class="nav-link" aria-current="page" href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">About</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="contact.html">Contact Us</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>
        <h1 class="mb-4">Contact Us</h1>
        <form class="row">
            <div class="mb-3 md:col-6">
                <label for="inputFirst" class="form-label">First name</label>
                <input type="text" class="form-field" id="inputFirst" aria-describedby="helpFirst">
            </div>
            <div class="mb-3 md:col-6">
                <label for="inputLast" class="form-label">Last name</label>
                <input type="text" class="form-field" id="inputLast" aria-describedby="helpLast">
            </div>
            <div class="mb-3 md:col-6">
                <label for="inputLast" class="form-label">Form Type</label>
                <div class="form-field">
                    <input type="radio" id="fieldPromptA" class="radio" name="fieldRadioGroup" />
                    <label for="fieldRadio1">Comment</label>
                </div>
                <div class="form-field">
                    <input type="radio" id="fieldPromptB" class="radio" name="fieldRadioGroup" />
                    <label for="fieldRadio2">Question</label>
                </div>
                <div class="form-field">
                    <input type="radio" id="fieldPromptC" class="radio" name="fieldRadioGroup" />
                    <label for="fieldRadio2">Support</label>
                </div>
            </div>
            <div class="mb-3 md:col-6">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="helpEmail">
            </div>
            <div class="mb-3 md:col-6">
                <label for="inputQuestion" class="form-label">Form Field</label>
                <input type="text" class="form-control" id="inputQuestion" aria-describedby="helpQuestion">
            </div>
            <div class="mb-3 md:col-6">
                <label for="inputPerm" class="form-label">I confirm that the details and information provided above are correct and accurate.</label><br>
                <input type="checkbox" id="fieldCheck" class="check"/>
            </div>
            <button type="submit" class="btn-solid theme-primary">Submit</button>
        </form>
        <footer>
            <p class="bg-secondary text-center mt-1 mx-4 p-3">&copy; 2026 Kenny Chau - CCT360</h1>
        </footer>
    </body>
</html>
